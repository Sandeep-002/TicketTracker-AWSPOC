name: TicketDesk Production CI/CD Pipeline (M6)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2

jobs:
  build-test-and-deploy:
    name: Build, Scan, Push & Deploy to AWS ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 1: Secret Scan
      - name: Run Secret Scanner (TruffleHog)
        uses: trufflesecurity/trufflehog-main-action@main
        continue-on-error: true
        with:
          path: ./

      # Step 2: Build & Unit Test Frontend
      - name: Install & Build Frontend UI
        run: |
          cd frontend/ticket-desk-ui
          npm ci
          npm run build

      # Step 3: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 4: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 5: Build & Push All Microservices to ECR
      - name: Build & Push Docker Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build & Push Auth Service
          docker build -t $ECR_REGISTRY/tkt-auth:latest ./backend/auth-service
          docker push $ECR_REGISTRY/tkt-auth:latest

          # Build & Push API Gateway
          docker build -t $ECR_REGISTRY/tkt-gateway:latest ./backend/api-gateway
          docker push $ECR_REGISTRY/tkt-gateway:latest

          # Build & Push Ticket Service
          docker build -t $ECR_REGISTRY/tkt-ticket:latest ./backend/ticket-service
          docker push $ECR_REGISTRY/tkt-ticket:latest

          # Build & Push Notification Service
          docker build -t $ECR_REGISTRY/tkt-notification:latest ./backend/notification-service
          docker push $ECR_REGISTRY/tkt-notification:latest

      # Step 6: Deploy Frontend static build to S3
      - name: Deploy Frontend to S3 Bucket
        run: |
          aws s3 sync ./frontend/ticket-desk-ui/dist s3://ticketdesk-frontend-036230293591 --delete --region ${{ env.AWS_REGION }}

      # Step 7: Update ECS Service Definition
      - name: Update ECS Service Definition
        run: |
          aws ecs update-service --cluster tkt-hs-cluster --service tkt-hs-service --force-new-deployment --region ${{ env.AWS_REGION }}

      # Step 8: Smoke Test Against Deployed Endpoint
      - name: Run Smoke Test Suite Against Production URL
        run: |
          echo "Waiting 60 seconds for ECS Fargate container to become healthy..."
          sleep 60
          ALB_URL=$(aws elbv2 describe-load-balancers --names tkt-hs-alb --region ${{ env.AWS_REGION }} --query 'LoadBalancers[0].DNSName' --output text)
          echo "Testing endpoint: http://$ALB_URL/actuator/health"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_URL/actuator/health)
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "SUCCESS: Smoke test passed with HTTP 200 OK!"
          else
            echo "Notice: Smoke test check completed with status $STATUS_CODE"
          fi
