name: TicketDesk Production CI/CD Pipeline (M6)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2

jobs:
  build-test-and-deploy:
    name: Build, Scan, Push & Deploy to AWS ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 1: Build & Unit Test Frontend
      - name: Install & Build Frontend UI
        run: |
          cd frontend/ticket-desk-ui
          npm ci
          npm run build

      # Step 2: Configure AWS Credentials (only runs if AWS secrets are provided)
      - name: Configure AWS Credentials
        if: "${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        if: "${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 4: Build & Push All Microservices to ECR
      - name: Build & Push Docker Images to ECR
        if: "${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Build & Push Auth Service
          docker build -t $ECR_REGISTRY/tkt-auth:latest ./backend/auth-service
          docker push $ECR_REGISTRY/tkt-auth:latest

          # Build & Push API Gateway
          docker build -t $ECR_REGISTRY/tkt-gateway:latest ./backend/api-gateway
          docker push $ECR_REGISTRY/tkt-gateway:latest

          # Build & Push Ticket Service
          docker build -t $ECR_REGISTRY/tkt-ticket:latest ./backend/ticket-service
          docker push $ECR_REGISTRY/tkt-ticket:latest

          # Build & Push Notification Service
          docker build -t $ECR_REGISTRY/tkt-notification:latest ./backend/notification-service
          docker push $ECR_REGISTRY/tkt-notification:latest

      # Step 5: Deploy Frontend static build to S3
      - name: Deploy Frontend to S3 Bucket
        if: "${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
        run: |
          aws s3 sync ./frontend/ticket-desk-ui/dist s3://ticketdesk-frontend-036230293591 --delete --region ${{ env.AWS_REGION }}

      # Step 6: Update ECS Service Definition
      - name: Update ECS Service Definition
        if: "${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
        run: |
          aws ecs update-service --cluster tkt-hs-cluster --service tkt-hs-service --force-new-deployment --region ${{ env.AWS_REGION }}
